<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover — под безопасные зоны iPhone; user-scalable=no — чтобы
         двойной тап и щипок не зумили игровое поле вместо управления. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>NOSTOS</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* position: fixed убирает bounce-скролл Safari на iOS — без него канвас
         уезжает вместе со страницей при протягивании пальцем. */
      body {
        position: fixed;
        inset: 0;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        /* Без touch-action: none первое же движение пальцем скроллит страницу
           вместо управления игроком. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
